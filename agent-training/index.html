<style>:root{
  --bg:#F6F4EF; --bg-2:#EFECE5; --card:#FFFFFF; --line:#E5E0D6; --line-d:#D8D1C4; --text:#1B2129; --dim:#5F6670; --mute:#9A9FA6;
  --ink:#1B2430; --ink-d:#0B1017; --on-ink:#FFFFFF;
  --pri:#2F7D5B; --pri-d:#24634A; --pri-soft:#E7F1EB;
  --blue:#2F5E9E; --blue-d:#244B80; --blue-soft:#E8EEF6;
  --gold:#B8893B; --gold-d:#94702F; --gold-soft:#F6EEDF; --gold-hi:#D4AE68; --gold-text:#8A6626; --trail:rgba(27,33,41,.5); --trail-bed:rgba(255,255,255,.45);
  --red:#B4473A; --red-d:#933A2F; --red-soft:#F7E7E4;
  --shadow:0 1px 2px rgba(20,24,30,.05), 0 8px 24px -14px rgba(20,24,30,.25);
  --serif:'Spectral',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
  --tabh:64px; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1216; --bg-2:#161A20; --card:#171B22; --line:#2A3038; --line-d:#20252C; --text:#ECE8E1; --dim:#A7ADB5; --mute:#6C737C;
  --ink:#ECE8E1; --ink-d:#B9B3A9; --on-ink:#12161B;
  --pri:#5DAE87; --pri-soft:#162820; --blue:#7FA6DC; --blue-soft:#152233; --gold:#D1A55A; --gold-soft:#2A2216; --gold-text:#DDB673; --trail:rgba(255,255,255,.5); --trail-bed:rgba(255,255,255,.06); --red:#DE7D70; --red-soft:#2E1B19;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6); } }
:root[data-theme="dark"]{
  --bg:#0F1216; --bg-2:#161A20; --card:#171B22; --line:#2A3038; --line-d:#20252C; --text:#ECE8E1; --dim:#A7ADB5; --mute:#6C737C;
  --ink:#ECE8E1; --ink-d:#B9B3A9; --on-ink:#12161B;
  --pri:#5DAE87; --pri-soft:#162820; --blue:#7FA6DC; --blue-soft:#152233; --gold:#D1A55A; --gold-soft:#2A2216; --gold-text:#DDB673; --trail:rgba(255,255,255,.5); --trail-bed:rgba(255,255,255,.06); --red:#DE7D70; --red-soft:#2E1B19;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.6); }
/* unit jewel tones */
.u-green{ --u:#2F7D5B; --u-d:#1F5A41; } .u-blue{ --u:#2F5E9E; --u-d:#1F4273; } .u-purple{ --u:#6A4C93; --u-d:#4B356B; }
.u-orange{ --u:#B0643A; --u-d:#824628; } .u-teal{ --u:#2D7C80; --u-d:#1E5A5D; } .u-pink{ --u:#9B3D55; --u-d:#6F2A3C; }

html{ scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px); }
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html,body{ background:var(--bg); color:var(--text); font-family:var(--sans); font-weight:400; -webkit-font-smoothing:antialiased; }
body{ min-height:100%; }
button{ font-family:inherit; color:inherit; }
[hidden]{ display:none !important; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:10px; }
svg.ic{ fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

/* top bar */
.topbar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-bottom:1px solid var(--line); }
.topbar-in{ max-width:680px; margin:0 auto; height:56px; display:flex; align-items:center; gap:10px; padding:0 16px; }
.back{ border:none; background:none; width:36px; height:36px; margin-left:-8px; border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--dim); cursor:pointer; }
.back svg{ width:22px; height:22px; }
.top-title{ flex:1; font-family:var(--serif); font-weight:600; font-size:1.1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.top-stats{ display:flex; gap:14px; }
.stat{ display:flex; align-items:center; gap:5px; font-weight:600; font-size:0.92rem; font-variant-numeric:tabular-nums; }
.stat svg{ width:19px; height:19px; }
.stat.fire{ color:var(--gold-text); } .stat.fire.off{ color:var(--mute); } .stat.chk{ color:var(--pri); }
main{ max-width:680px; margin:0 auto; padding:24px 18px calc(var(--tabh) + 44px + env(safe-area-inset-bottom,0px)); }

/* type */
.page-title{ font-family:var(--serif); font-weight:600; font-size:2rem; line-height:1.15; margin-bottom:8px; letter-spacing:-.01em; }
.eyebrow{ font-size:0.7rem; font-weight:600; color:var(--gold-text); text-transform:uppercase; letter-spacing:.14em; margin-bottom:8px; }
.lead{ font-size:1rem; line-height:1.6; color:var(--dim); margin-bottom:22px; max-width:60ch; }
.sec-h{ font-family:var(--serif); font-weight:600; font-size:1.35rem; margin:34px 0 12px; }
.body{ font-size:0.98rem; line-height:1.65; }
.body.small{ font-size:0.9rem; color:var(--dim); margin-top:12px; }
.body b{ color:var(--text); font-weight:600; }
.hint{ font-size:0.88rem; line-height:1.55; color:var(--dim); margin:8px 0 12px; }
.hint b{ color:var(--text); font-weight:600; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px 18px; box-shadow:var(--shadow); }

/* buttons */
.solid-btn, .ghost-btn, .play-btn, .small-btn, .pop-btn, .speak-btn{ font-family:var(--sans); font-weight:600; cursor:pointer; transition:transform .1s, box-shadow .15s, background .15s, filter .15s; }
.solid-btn, .solid-btn.gold, .solid-btn.blue{ background:var(--ink); color:var(--on-ink); border:none; border-radius:12px; box-shadow:0 1px 0 var(--ink-d), 0 10px 22px -12px rgba(0,0,0,.45); padding:14px 20px; font-size:0.95rem; }
.solid-btn:hover{ filter:brightness(1.15); }
.solid-btn:disabled{ background:var(--line); color:var(--mute); box-shadow:none; cursor:not-allowed; filter:none; }
.ghost-btn{ background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:12px; box-shadow:0 1px 0 var(--line-d); padding:13px 18px; font-size:0.92rem; }
.ghost-btn.danger{ color:var(--red); }
.play-btn, .small-btn{ flex-shrink:0; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:10px; box-shadow:0 1px 0 var(--line-d); padding:8px 13px; font-size:0.84rem; white-space:nowrap; }
.play-btn.playing, .small-btn.playing{ background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
.solid-btn:active:not(:disabled), .ghost-btn:active, .play-btn:active, .small-btn:active, .pop-btn:active, .speak-btn:active, .row:active, .node:active, .unit-btn:active{ transform:translateY(1px) scale(.99); }
.wide{ width:100%; margin-top:12px; }

/* home: the learning path */
.unit{ position:relative; overflow:hidden; display:flex; align-items:center; gap:12px; background:linear-gradient(135deg, var(--u), var(--u-d)); color:#fff; border-radius:18px; box-shadow:0 14px 30px -18px var(--u-d); padding:20px; margin:12px 0 30px; }
.unit::after{ content:''; position:absolute; right:-40px; top:-60px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); pointer-events:none; }
.unit-t{ flex:1; min-width:0; }
.unit-k{ font-size:0.68rem; font-weight:600; text-transform:uppercase; letter-spacing:.16em; opacity:.75; }
.unit-n{ font-family:var(--serif); font-size:1.45rem; font-weight:600; line-height:1.2; margin-top:3px; }
.unit-s{ font-size:0.85rem; opacity:.8; margin-top:3px; }
.unit-btn{ position:relative; z-index:1; flex-shrink:0; display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.3); border-radius:999px; padding:8px 13px; font-weight:600; font-size:0.8rem; cursor:pointer; }
.unit-btn svg{ width:16px; height:16px; }
.path{ display:flex; flex-direction:column; align-items:center; gap:22px; padding:6px 0 36px; }
.node{ position:relative; width:64px; height:64px; border-radius:50%; border:none; background:linear-gradient(145deg, var(--u), var(--u-d)); color:#fff; box-shadow:0 2px 0 var(--u-d), 0 12px 24px -10px var(--u); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .12s; }
.node svg{ width:24px; height:24px; }
.node.todo{ background:var(--card); color:var(--mute); border:1px solid var(--line); box-shadow:0 1px 0 var(--line-d), 0 8px 18px -12px rgba(0,0,0,.25); }
.node.done{ background:linear-gradient(145deg, var(--gold-hi), var(--gold-d)); box-shadow:0 2px 0 var(--gold-d), 0 12px 24px -12px var(--gold); }
.node.now{ outline:1.5px solid color-mix(in srgb, var(--u) 45%, transparent); outline-offset:6px; }
.node.open{ transform:scale(1.05); }
.tip{ position:absolute; bottom:calc(100% + 14px); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--on-ink); border-radius:999px; padding:6px 12px; font-weight:600; font-size:0.68rem; text-transform:uppercase; letter-spacing:.14em; white-space:nowrap; animation:bob 2.4s ease-in-out infinite; pointer-events:none; }
.tip::after{ content:''; position:absolute; top:100%; left:50%; margin-left:-5px; border:5px solid transparent; border-top-color:var(--ink); }
@keyframes bob{ 50%{ transform:translate(-50%,-3px); } }
.pop, .pop.todo{ position:relative; width:100%; max-width:340px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:16px; box-shadow:0 22px 48px -20px rgba(0,0,0,.4); padding:18px 18px 18px; margin-top:-4px; animation:popIn .18s ease-out; }
.pop::before{ content:''; position:absolute; bottom:100%; left:calc(50% + var(--x,0px)); margin-left:-8px; border:8px solid transparent; border-bottom-color:var(--line); }
.pop::after{ content:''; position:absolute; bottom:calc(100% - 1.5px); left:calc(50% + var(--x,0px)); margin-left:-7px; border:7px solid transparent; border-bottom-color:var(--card); }
.pop-t{ font-family:var(--serif); font-size:1.2rem; font-weight:600; line-height:1.3; }
.pop-s, .pop.todo .pop-s{ font-size:0.9rem; line-height:1.5; color:var(--dim); margin:6px 0 16px; }
.pop-btn, .pop.todo .pop-btn{ width:100%; background:var(--ink); color:var(--on-ink); border:none; border-radius:12px; padding:12px; font-size:0.92rem; }
@keyframes popIn{ from{ opacity:0; transform:translateY(-4px); } }
.principles{ margin-top:10px; }

/* lists */
.list{ display:flex; flex-direction:column; gap:10px; }
.row{ display:flex; align-items:center; gap:14px; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:14px 16px; cursor:pointer; width:100%; transition:transform .1s, border-color .15s; }
.row:hover{ border-color:var(--line-d); }
.row-n{ flex:0 0 38px; height:38px; border-radius:50%; background:linear-gradient(145deg, var(--u,var(--pri)), var(--u-d,var(--pri-d))); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:0.9rem; }
.row-n.done{ background:linear-gradient(145deg, var(--gold-hi), var(--gold-d)); }
.row-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
.row-title{ font-family:var(--serif); font-weight:600; font-size:1.08rem; }
.row-sub{ font-size:0.86rem; color:var(--dim); line-height:1.45; }
.row-meta{ font-size:0.76rem; font-weight:600; color:var(--gold-text); }
.chev{ font-size:1.4rem; color:var(--mute); }

/* lesson */
.step{ display:flex; align-items:center; gap:12px; font-family:var(--serif); font-weight:600; font-size:1.35rem; margin:38px 0 14px; }
.step-n{ flex:0 0 28px; height:28px; border-radius:50%; background:var(--ink); color:var(--on-ink); font-family:var(--sans); font-size:0.8rem; font-weight:600; display:flex; align-items:center; justify-content:center; }
.rule{ font-family:var(--serif); font-weight:500; font-size:1.3rem; line-height:1.5; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
.pair{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:var(--shadow); }
.pair-moment{ font-weight:600; font-size:0.98rem; margin-bottom:10px; }
.pair-normal span, .pair-better > span:first-child{ display:block; font-family:var(--sans); font-size:0.66rem; font-weight:600; text-transform:uppercase; letter-spacing:.14em; margin-bottom:4px; }
.pair-normal{ font-size:0.94rem; line-height:1.55; color:var(--dim); background:var(--bg-2); border-radius:10px; padding:10px 14px; }
.pair-normal span{ color:var(--red); }
.pair-better{ margin-top:10px; font-family:var(--serif); font-weight:500; font-size:1.15rem; line-height:1.7; background:var(--pri-soft); border-radius:10px; padding:10px 14px; }
.pair-better > span:first-child{ color:var(--pri); }
.pair-foot{ display:flex; gap:12px; align-items:flex-start; margin-top:12px; }
.pair-note{ font-size:0.88rem; line-height:1.5; color:var(--dim); flex:1; padding-top:6px; }
.pause{ color:var(--gold); font-weight:700; letter-spacing:0.12em; font-family:var(--sans); font-size:.85em; }
.down{ color:var(--gold); font-weight:700; }
.stress{ border-bottom:2px solid var(--gold); }
.w.stress{ font-weight:600; border-bottom:2px solid var(--gold); }
.say-legend{ font-size:0.78rem; color:var(--dim); text-align:center; margin-top:12px; }
.say-legend .stress{ color:var(--text); font-weight:600; }
.breath{ color:var(--gold); font-weight:700; margin:0 4px; }
.script{ font-family:var(--serif); font-weight:500; font-size:1.18rem; line-height:2; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--gold); border-radius:14px; padding:16px 18px; }
.script .note{ display:block; font-family:var(--sans); font-style:italic; font-size:0.84rem; color:var(--dim); line-height:1.5; }
.row-actions{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:12px; }
.legend{ font-size:0.8rem; color:var(--dim); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.builder{ display:grid; gap:12px; }
.builder input.need{ border-color:var(--red); box-shadow:0 0 0 3px color-mix(in srgb, var(--red) 18%, transparent); }
.builder label, .settings label{ display:grid; gap:6px; font-size:0.86rem; font-weight:500; color:var(--dim); }
input:not([type]), input[type=text], select, textarea{ width:100%; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:400 0.98rem/1.5 var(--sans); }
input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--gold); box-shadow:0 0 0 3px color-mix(in srgb, var(--gold) 18%, transparent); }
textarea{ min-height:100px; resize:vertical; }
.built{ font-family:var(--serif); font-weight:500; font-size:1.15rem; line-height:1.7; padding:12px 14px; background:var(--bg-2); border-left:3px solid var(--gold); border-radius:10px; }
.timer-card{ display:grid; gap:4px; }
.drill-topic{ font-family:var(--serif); font-weight:600; font-size:1.3rem; line-height:1.4; margin:8px 0 12px; }
.timer-row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.timer{ margin-left:auto; font-weight:600; font-size:1.7rem; font-variant-numeric:tabular-nums; }
.timer.up{ color:var(--red); }
.field-label{ display:block; font-weight:600; font-size:0.94rem; margin:20px 0 8px; }
.rate-row{ display:flex; gap:8px; }
.rate-btn{ width:46px; height:46px; border-radius:50%; border:1px solid var(--line); background:var(--card); font-weight:600; font-size:1rem; cursor:pointer; }
.rate-btn.on{ background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
.end-nav{ display:flex; justify-content:space-between; gap:10px; margin-top:36px; padding-top:20px; border-top:1px solid var(--line); }
details.fold{ margin:14px 0 4px; }
details.fold summary{ cursor:pointer; font-weight:600; font-size:0.92rem; color:var(--gold-text); padding:8px 0; }
details.fold > .how, details.fold > .body{ margin-top:6px; }
.how{ padding-left:20px; }
.how li{ font-size:0.95rem; line-height:1.6; padding:6px 0; }
.how b{ color:var(--text); font-weight:600; }

/* scenario page */
.hero{ position:relative; overflow:hidden; background:linear-gradient(135deg, var(--u), var(--u-d)); color:#fff; border-radius:20px; box-shadow:0 16px 34px -20px var(--u-d); padding:22px 20px 24px; margin-bottom:16px; }
.hero::after{ content:''; position:absolute; right:-50px; top:-70px; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%); }
.hero .eyebrow{ color:#fff; opacity:.75; }
.hero .page-title{ margin:2px 0 8px; }
.hero-goal{ font-size:0.98rem; line-height:1.55; opacity:.9; }
.brief p{ font-size:0.95rem; line-height:1.6; margin-bottom:10px; }
.brief p > span{ display:block; font-size:0.66rem; font-weight:600; color:var(--gold-text); text-transform:uppercase; letter-spacing:.14em; margin-bottom:3px; }
.brief .uses{ font-size:0.85rem; color:var(--dim); margin:0; }
.link{ background:none; border:none; color:var(--text); font-weight:600; text-decoration:underline; text-decoration-color:var(--gold); text-underline-offset:3px; cursor:pointer; font-size:inherit; padding:2px; }
.start-btn{ width:100%; margin-top:18px; padding:16px; font-size:1rem; }
.how3{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:22px 0 6px; }
.how3 div{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 12px; font-weight:600; font-size:0.92rem; display:flex; flex-direction:column; gap:4px; }
.how3 b{ font-family:var(--serif); font-size:1.2rem; color:var(--gold); font-weight:600; margin-bottom:2px; }
.how3 span{ font-weight:400; font-size:0.8rem; line-height:1.45; color:var(--dim); }
.script-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin:6px 0 12px; flex-wrap:wrap; }
.toggle{ display:flex; gap:8px; align-items:center; font-size:0.88rem; font-weight:500; cursor:pointer; }
.toggle input{ accent-color:var(--gold); width:17px; height:17px; }

/* chat bubbles */
.sc-script{ display:flex; flex-direction:column; gap:12px; }
.sl{ max-width:88%; border-radius:16px; padding:10px 14px 12px; border:1px solid var(--line); background:var(--card); }
.sl.them{ align-self:flex-start; border-bottom-left-radius:6px; }
.sl.them.alt{ background:var(--gold-soft); }
.sl.you{ align-self:flex-end; max-width:92%; background:var(--ink); color:var(--on-ink); border-color:var(--ink); border-bottom-right-radius:6px; }
.sl.stage{ align-self:center; max-width:90%; border:none; background:none; padding:2px 14px; font-style:italic; font-size:0.86rem; color:var(--dim); text-align:center; }
.sl-who{ font-size:0.64rem; font-weight:600; text-transform:uppercase; letter-spacing:.14em; color:var(--mute); margin-bottom:4px; }
.sl.you .sl-who{ color:var(--gold-hi); text-align:right; }
.sl-text{ font-family:var(--serif); font-weight:500; font-size:1.08rem; line-height:1.7; }
.sl.you .pause, .sl.you .down{ color:var(--gold-hi); }
.sl-note{ font-size:0.84rem; line-height:1.5; color:var(--dim); margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
.sl.you .sl-note{ color:color-mix(in srgb, var(--on-ink) 70%, transparent); border-top-color:color-mix(in srgb, var(--on-ink) 20%, transparent); }
.sc-script.no-coach .sl-note{ display:none; }
.w{ border-radius:4px; transition:background .1s; }
.w.on{ background:var(--gold); color:#fff; box-shadow:0 0 0 2px var(--gold); }

/* practice: full-screen focus mode */
body.focus .topbar, body.focus .tabbar{ display:none; }
body.focus main{ padding-top:16px; padding-bottom:calc(240px + env(safe-area-inset-bottom,0px)); }
.fx-top{ display:flex; align-items:center; gap:14px; margin-bottom:26px; }
.fx-x{ flex:0 0 36px; height:36px; border:none; background:none; color:var(--dim); cursor:pointer; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.fx-x svg{ width:22px; height:22px; }
.pbar{ flex:1; height:6px; border-radius:3px; background:var(--line); overflow:hidden; }
.pbar i{ display:block; height:100%; border-radius:3px; background:linear-gradient(90deg, var(--gold-hi), var(--gold)); transition:width .5s ease; min-width:6px; }
.speed{ flex:0 0 auto; min-width:52px; height:32px; padding:0 10px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-weight:600; font-size:0.8rem; color:var(--dim); cursor:pointer; font-variant-numeric:tabular-nums; }
.fx-title{ font-family:var(--serif); font-weight:600; font-size:1.7rem; line-height:1.2; margin-bottom:20px; }
.char{ display:flex; align-items:flex-end; gap:12px; margin-bottom:14px; }
.av{ flex:0 0 46px; height:46px; border-radius:50%; background:linear-gradient(145deg, var(--u,var(--blue)), var(--u-d,var(--blue-d))); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:600; font-size:1.2rem; box-shadow:0 8px 18px -10px var(--u-d,#000); }
.av.alt{ background:linear-gradient(145deg, var(--gold-hi), var(--gold-d)); }
.bub{ position:relative; flex:1; min-width:0; border:1px solid var(--line); border-radius:16px; border-bottom-left-radius:6px; padding:10px 14px 12px; background:var(--card); box-shadow:var(--shadow); }
.bub .sl-who{ margin-bottom:3px; }
.bub .sl-text{ font-size:1.05rem; }
.stagenote{ font-style:italic; color:var(--dim); font-size:0.88rem; text-align:center; margin:4px 0 12px; }
.say{ display:flex; gap:14px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-top:8px; box-shadow:var(--shadow); }
.spk{ flex:0 0 46px; height:46px; border-radius:50%; border:none; background:var(--ink); color:var(--on-ink); display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 18px -10px rgba(0,0,0,.5); }
.spk svg{ width:22px; height:22px; }
.spk.playing{ animation:pulse 1.2s ease-in-out infinite; }
.say-body{ flex:1; min-width:0; }
.say-text{ font-family:var(--serif); font-weight:500; font-size:1.35rem; line-height:1.75; }
.say.hide .say-text{ filter:blur(9px); user-select:none; }
.say-note{ font-size:0.86rem; color:var(--dim); margin-top:10px; padding-top:10px; border-top:1px solid var(--line); }
.speak-btn{ width:100%; margin-top:22px; display:flex; align-items:center; justify-content:center; gap:10px; background:var(--card); color:var(--text); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:18px; font-size:1rem; }
.speak-btn svg{ width:22px; height:22px; color:var(--gold); }
.speak-btn.on{ color:var(--red); border-color:color-mix(in srgb, var(--red) 50%, transparent); background:var(--red-soft); }
.speak-btn:disabled{ opacity:.6; cursor:default; }
#recTime{ font-variant-numeric:tabular-nums; }
.eq{ display:inline-flex; gap:3px; align-items:center; height:18px; }
.eq i{ width:3px; height:100%; border-radius:2px; background:currentColor; animation:eq .9s ease-in-out infinite; }
.eq i:nth-child(2){ animation-delay:.15s; } .eq i:nth-child(3){ animation-delay:.3s; } .eq i:nth-child(4){ animation-delay:.45s; }
@keyframes eq{ 50%{ transform:scaleY(.3); } }
@keyframes pulse{ 50%{ box-shadow:0 0 0 8px color-mix(in srgb, var(--ink) 12%, transparent); } }
.listening{ display:flex; gap:8px; align-items:center; justify-content:center; color:var(--gold-text); font-weight:600; font-size:0.88rem; margin-top:28px; }
.link-btn{ display:block; margin:14px auto 0; background:none; border:none; color:var(--dim); font-weight:600; font-size:0.86rem; cursor:pointer; padding:8px; text-decoration:underline; text-underline-offset:3px; }
.cmp{ margin-top:18px; }
.cmp-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
.cmp-row:last-of-type{ border-bottom:none; }
.cmp-lab{ flex:0 0 56px; font-weight:600; font-size:0.88rem; }
.cmp-wave{ flex:1; min-width:0; height:30px; display:flex; align-items:center; color:var(--dim); font-size:0.86rem; font-variant-numeric:tabular-nums; }
.wave{ width:100%; height:30px; } .wave rect{ fill:var(--gold); } .wave rect.sil{ fill:var(--line); }
.small-btn.both{ width:100%; margin-top:10px; }
.alert{ width:100%; text-align:left; background:var(--red-soft); border:1px solid color-mix(in srgb, var(--red) 35%, transparent); border-radius:12px; padding:12px 14px; font-size:0.9rem; line-height:1.5; margin-top:16px; }
/* footer + result banner */
.fx-foot{ position:fixed; left:0; right:0; bottom:0; z-index:8; background:color-mix(in srgb, var(--bg) 92%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--line); padding:16px 18px calc(16px + env(safe-area-inset-bottom,0px)); animation:slideUp .22s ease-out; }
.fx-foot-in{ max-width:644px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
.fx-btns{ display:flex; gap:12px; justify-content:space-between; }
.fx-btns .solid-btn{ flex:1; max-width:260px; margin-left:auto; }
.fx-foot.good{ background:var(--pri-soft); border-top-color:color-mix(in srgb, var(--pri) 25%, transparent); }
.fx-foot.almost{ background:var(--gold-soft); border-top-color:color-mix(in srgb, var(--gold) 30%, transparent); }
.fx-foot.neutral{ background:var(--blue-soft); border-top-color:color-mix(in srgb, var(--blue) 25%, transparent); }
.res{ display:flex; gap:12px; align-items:flex-start; }
.res-ic{ flex:0 0 38px; height:38px; border-radius:50%; background:var(--card); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); }
.res-ic svg{ width:20px; height:20px; }
.good .res-ic{ color:var(--pri); } .almost .res-ic{ color:var(--gold); } .neutral .res-ic{ color:var(--blue); }
.res-t{ font-family:var(--serif); font-weight:600; font-size:1.3rem; line-height:1.3; }
.good .res-t{ color:var(--pri); } .almost .res-t{ color:var(--gold-text); } .neutral .res-t{ color:var(--blue); }
.fb{ list-style:none; display:grid; gap:4px; margin-top:4px; }
.fb li{ font-size:0.88rem; line-height:1.5; color:var(--text); }
.fb b{ font-weight:600; }
.fb-tip{ font-size:0.95rem; color:var(--text); margin-top:2px; }
.fb-foot{ font-size:0.74rem; color:var(--dim); margin-top:4px; }
@keyframes slideUp{ from{ transform:translateY(24px); opacity:.5; } }
/* round complete */
.done-wrap{ text-align:center; padding-top:34px; }
.done-badge{ width:96px; height:96px; margin:0 auto 22px; border-radius:50%; background:linear-gradient(145deg, var(--gold-hi), var(--gold-d)); color:#fff; box-shadow:0 18px 36px -16px var(--gold); display:flex; align-items:center; justify-content:center; animation:pop .6s cubic-bezier(.3,1.5,.5,1); }
.done-badge svg{ width:40px; height:40px; }
@keyframes pop{ from{ transform:scale(.5); opacity:0; } }
.done-title{ font-family:var(--serif); font-weight:600; font-size:2rem; margin-bottom:10px; }
.tiles{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:28px 0 8px; }
.tile{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 6px; box-shadow:var(--shadow); }
.tile span{ display:block; font-size:0.64rem; font-weight:600; text-transform:uppercase; letter-spacing:.14em; color:var(--mute); margin-bottom:4px; }
.tile b{ display:block; font-family:var(--serif); font-size:1.6rem; font-weight:600; color:var(--text); }
.tile.t3 b{ color:var(--gold-text); }

/* settings */
.settings{ display:grid; gap:14px; }
.sec-k{ font-size:.66rem; font-weight:600; text-transform:uppercase; letter-spacing:.14em; color:var(--gold-text); margin:26px 0 8px; }
.src-row{ display:flex; gap:8px; }
.small-btn.on{ background:var(--ink); color:var(--on-ink); border-color:var(--ink); }
.settings label.toggle{ display:flex; color:var(--text); font-size:0.92rem; }
.rate-val{ float:right; color:var(--text); font-weight:600; }
.settings input[type=range]{ accent-color:var(--gold); width:100%; }

/* navigation: bottom tabs on phones, left rail on wide screens */
.tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:7; background:color-mix(in srgb, var(--card) 90%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); display:flex; justify-content:center; }
.nav-logo{ display:none; }
.tabbar-in{ width:100%; max-width:680px; display:flex; height:var(--tabh); padding:6px 8px; gap:4px; }
.tb{ position:relative; flex:1; border:none; background:none; border-radius:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:0.68rem; font-weight:500; color:var(--mute); cursor:pointer; }
.tb svg{ width:23px; height:23px; }
.tb.on{ color:var(--text); font-weight:600; }
.tb.on svg{ color:var(--gold); }
@media (min-width:900px){
  body{ padding-left:250px; }
  body.focus{ padding-left:0; }
  .tabbar{ top:0; right:auto; width:250px; flex-direction:column; justify-content:flex-start; border-top:none; border-right:1px solid var(--line); padding:30px 16px; background:var(--card); }
  .nav-logo{ display:block; font-family:var(--serif); font-weight:600; font-size:1.4rem; line-height:1.15; padding:0 12px 30px; }
  .nav-logo::before{ content:''; display:block; width:28px; height:3px; border-radius:2px; background:var(--gold); margin-bottom:14px; }
  .top-title.logo{ visibility:hidden; }
  .tabbar-in{ flex-direction:column; height:auto; padding:0; gap:4px; }
  .tb{ flex:none; flex-direction:row; justify-content:flex-start; gap:14px; padding:11px 12px; font-size:0.92rem; }
  .tb svg{ width:22px; height:22px; }
  .tb.on{ background:var(--bg-2); }

<div id="phc-gate">
  <div class="gate-card">
    <div class="gate-logo">PHC</div>
    <div class="gate-sub">Property Hub Cambodia · Agent Training</div>
    <input id="gate-pw" class="gate-input" type="password" placeholder="Password" autocomplete="current-password">

    <div id="gate-err" class="gate-err">Incorrect password. Try again.</div>
  </div>
</div>
<script>(function(){
  var g=document.getElementById('phc-gate');
  if(sessionStorage.getItem('phc_agent_auth')==='1'||sessionStorage.getItem('phc_ceo_auth')==='1'){g.style.display='none';}
  else{g.style.display='flex';setTimeout(function(){document.getElementById('gate-pw').focus();},50);}
  window.phcCheck=function(){
    var v=document.getElementById('gate-pw').value;
    if(v==='PHC2026'){sessionStorage.setItem('phc_agent_auth','1');g.style.display='none';}
    else if(v==='Nick@PHC2026'){sessionStorage.setItem('phc_ceo_auth','1');sessionStorage.setItem('phc_agent_auth','1');g.style.display='none';}
    else{document.getElementById('gate-err').style.display='block';document.getElementById('gate-pw').value='';document.getElementById('gate-pw').focus();}
  };
  document.getElementById('gate-pw').addEventListener('keydown',function(e){if(e.key==='Enter')phcCheck();});
})();</script>

/* ---------------- OFFLINE ----------------

  if(o.total&&o.done>=o.total) return `<b>Ready offline</b> · all ${o.total} voice clips saved on this device`;
  return `Saving for offline… ${o.total?Math.round(o.done/o.total*100):0}%`; }

/* Voiced-time envelope of a clip, so the highlight pauses during silences. null if the clip can't be read. */
const ENV={};
function clipEnv(url){ return ENV[url]||(ENV[url]=(async()=>{ try{
  const AC=window.AudioContext||window.webkitAudioContext, ac=new AC(), buf=await ac.decodeAudioData(await (await fetch(url)).arrayBuffer()); try{ ac.close(); }catch(e){}
  const d=buf.getChannelData(0), fr=Math.max(1,Math.round(buf.sampleRate*0.02)), n=Math.floor(d.length/fr), rms=new Float32Array(n);
  for(let f=0;f<n;f++){ let s=0; for(let k=f*fr;k<(f+1)*fr;k++) s+=d[k]*d[k]; rms[f]=Math.sqrt(s/fr); }
  const so=[...rms].sort((a,b)=>a-b), lo=so[Math.floor(n*0.1)]||0, hi=so[Math.floor(n*0.98)]||0, thr=lo+(hi-lo)*0.12, cum=new Float32Array(n+1);
  for(let f=0;f<n;f++) cum[f+1]=cum[f]+(rms[f]>thr?1:0); return cum; }catch(e){ return null; } })()); }
/* Play a clip and move the word highlight through the line in proportion to word length, over voiced time only. */
const PLAYER=new Audio(); let playSeq=0;   // which playClip call currently owns PLAYER
/* iPhones let an audio element play by itself only after it has played once inside a tap. Audio now starts a moment
   after a screen opens (LEAD), so the first tap plays a silent sound on the shared player to unlock it for the visit. */
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
let audioReady=false;
function unlockAudio(){ if(audioReady) return; audioReady=true; if(PLAYER.src&&!PLAYER.paused) return;
  PLAYER.src=SILENT; PLAYER.play().then(()=>{ if(PLAYER.src===SILENT) PLAYER.pause(); }).catch(()=>{ audioReady=false; }); }
['touchend','click','keydown'].forEach(ev=>addEventListener(ev,unlockAudio,{capture:true}));
function playClip(c,spans,t){ return new Promise(async res=>{ if(t!==tok) return res(false); const env=spans.length?await clipEnv(c.url):null; if(t!==tok) return res(false);
  const my=++playSeq, a=PLAYER; a.pause(); a.src=c.url; recAudio=a; a.defaultPlaybackRate=a.playbackRate=Math.min(1.35,Math.max(.7,state.rate/0.85));
  const w=spans.map(s=>s.textContent.length+1), tot=w.reduce((x,y)=>x+y,0)||1; let raf=0, done=false;
  const end=ok=>{ if(done) return; done=true; cancelAnimationFrame(raf); spans.forEach(s=>s.classList.remove('on')); if(playSeq===my) a.pause(); res(ok&&t===tok); };
  const tick=()=>{ if(t!==tok) return end(false); const t0=c.start||0, t1=c.stop||a.duration||0;
    if(c.stop&&a.currentTime>=c.stop) return end(true);
    const at=f=>env[Math.max(0,Math.min(env.length-1,Math.round(f/0.02)))];
    if(t1>t0){ const p=(env&&at(t1)>at(t0)?Math.max(0,(at(a.currentTime)-at(t0))/(at(t1)-at(t0))):Math.max(0,(a.currentTime-t0)/(t1-t0)))*tot; let acc=0, hit=null; for(let i=0;i<spans.length;i++){ acc+=w[i]; if(p<=acc){ hit=spans[i]; break; } } spans.forEach(s=>s.classList.toggle('on',s===hit)); }
    raf=requestAnimationFrame(tick); };
  a.onended=()=>end(true); a.onerror=()=>end(false);
  a.onloadedmetadata=()=>{ if(c.start) a.currentTime=c.start; a.play().then(()=>{ raf=requestAnimationFrame(tick); }).catch(()=>end(false)); };
}); }

let stRec=null; const studioOpen=new Set([0]);
async function studioRecord(id){
  if(stRec){ const same=stRec.id===id; stRec.mr.stop(); if(same) return; }
  stopAll();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ alert(window.isSecureContext?'This browser can\'t record audio.':'The microphone only works on a secure (https) link.'); return; }
  let stream; try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }catch(e){ alert('Microphone access was blocked. Allow it for this site, then try again.'); return; }
  const mr=new MediaRecorder(stream), chunks=[];
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{ stream.getTracks().forEach(x=>x.stop()); stRec=null;
    const blob=new Blob(chunks,{type:mr.mimeType||'audio/mp4'}), r=await analyze(blob);
    if(!r||r.empty){ alert('No speech heard in that take. Try again, a little closer to the microphone.'); render(); return; }
    // keep a little air around the speech so the model starts promptly
    const take={blob, type:blob.type, start:Math.max(0,r.a-0.12), stop:r.b+0.3, at:Date.now()};
    await IDB.set(id,take); if(MINE[id]) URL.revokeObjectURL(MINE[id].url); MINE[id]={url:URL.createObjectURL(blob), start:take.start, stop:take.stop}; render(); };
  stRec={id,mr}; mr.start(); render(); }
async function studioAct(a,btn){ const id=btn.dataset.id;
  if(a==='st-rec') return studioRecord(id);
  if(a==='st-play'){ const c=MINE[id]; if(c) runBtn(btn,t=>playClip(c,[],t)); return; }
  if(a==='st-del'){ if(!confirm('Delete your recording of this line?')) return; await IDB.del(id); if(MINE[id]) URL.revokeObjectURL(MINE[id].url); delete MINE[id]; return render(); }
  if(a==='st-export') return exportTakes(btn); }

/* Export takes as a .zip (stored, no compression) with a manifest, to add to the app's audio/ folder for the team. */
function crc32(b){ let c=~0; for(let i=0;i<b.length;i++){ c^=b[i]; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; } return ~c>>>0; }
async function makeZip(files){ const parts=[], cen=[]; let off=0; const enc=new TextEncoder();
  for(const f of files){ const data=new Uint8Array(await f.blob.arrayBuffer()), name=enc.encode(f.name), crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30)); [[0,0x04034b50,4],[4,20,2],[12,0x21,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,name.length,2]].forEach(([o,v,n])=>n===4?h.setUint32(o,v,true):h.setUint16(o,v,true));
    const c=new DataView(new ArrayBuffer(46)); [[0,0x02014b50,4],[4,20,2],[6,20,2],[14,0x21,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,name.length,2],[42,off,4]].forEach(([o,v,n])=>n===4?c.setUint32(o,v,true):c.setUint16(o,v,true));
    parts.push(h,name,data); cen.push(c,name); off+=30+name.length+data.length; }

  [[0,0x06054b50,4],[8,files.length,2],[10,files.length,2],[12,size,4],[16,off,4]].forEach(([o,v,n])=>n===4?e.setUint32(o,v,true):e.setUint16(o,v,true));

async function exportTakes(btn){ btn.disabled=true; const files=[], manifest={};
  for(const k of (await IDB.keys())||[]){ if(String(k).startsWith('pv:')) continue; const v=await IDB.get(k); if(!v||!v.blob) continue; const ext=/mp4|m4a|aac/.test(v.type)?'m4a':/ogg/.test(v.type)?'ogg':'webm';

  files.push({name:'manifest.json', blob:new Blob([JSON.stringify(manifest,null,1)],{type:'application/json'})});
  const a=document.createElement('a'); a.href=URL.createObjectURL(await makeZip(files)); a.download='speak-like-an-advisor-voice.zip'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),5000); btn.disabled=false; }

/* ---------------- PROFILE ----------------
   Scripts are general. Where you introduce yourself they say {name} and {intro}, filled from your profile
   (asked once on first open, editable in Settings). Those lines use the device voice: a recording can't say every name. */
function introBody(){ const n=state.intro; return `I help *${n.who||'my clients'}* ${n.get||'make better decisions'}${n.avoid?` without ${n.avoid}`:''}.`; }

/* ---------------- YOUR NAME IN THE SAME VOICE ----------------
   Lines with {name} / {intro} can't be pre-recorded, so the phone makes them itself with the same Kokoro voices
   (kokoro-js, a one-time ~90 MB model download, cached by the browser). They're built in the background after the
   profile is saved or the app opens, stored in IndexedDB as "pv:<hash of the filled text + voice>" (so a new name or
   intro simply makes new ones), and play like any clip. Until they're ready, or if the phone can't run the model,
   those lines use the device voice as before. Same cast, pauses and loudness as tools/make_voice.py. */
const KCAST={ you:['am_michael',0.92], coach:['af_heart',1], male:[['am_fenrir',1],['bm_george',1]], female:[['af_bella',1],['bf_emma',1],['af_nicole',1]],
  neutral:{Host:['af_nicole',1],Audience:['bf_emma',1],Investor:['am_fenrir',1],Client:['am_fenrir',1],Dara:['af_bella',1]} };
function kCast(sc){ const cast={you:KCAST.you}; let m=0,f=0;
  [...new Set(sc.lines.map(l=>l[0]).filter(w=>w!=='you'&&w!=='stage'))].forEach(k=>{ const name=k==='them'?sc.them:k.split(':')[1];
    cast[k]=KCAST.neutral[name]||(/^(Ms|Mrs|Miss)\.?\s/.test(name)?KCAST.female[f++%3]:KCAST.male[m++%2]); }); return cast; }
function fnv(t){ let h=0x811c9dc5; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(16); }
const pvKey=(text,v)=>'pv:'+fnv(personal(text)+'|'+v[0]+'|'+v[1]+'|lead150');
function pvClip(text,v){ return useFiles()&&isPersonal(text)&&MINE[pvKey(text,v||KCAST.you)]||null; }
const prepClip=text=>useFiles()&&MINE[pvKey(text,KCAST.you)]||null;   // Meeting prep lines: your own words, made on this device
function pvJobs(){ const jobs=new Map(), add=(t,v,pri=2)=>{ if(isPersonal(t)) jobs.set(pvKey(t,v),[t,v,pri]); };
  preps().forEach(m=>m.lines.forEach(ln=>{ const t=prepMarkup(ln); jobs.set(pvKey(t,KCAST.you),[t,KCAST.you,0]); }));
  SCENARIOS.forEach(sc=>{ const c=kCast(sc); sc.lines.forEach(([w,t])=>{ if(w!=='stage') add(t,c[w]); }); });
  LESSONS.forEach(l=>{ l.pairs.forEach(p=>{ if(!p.noPlay&&!p.lang){ add(p.normal,KCAST.you); add(p.better,KCAST.you); } }); add(drillMarkup(l.drill.script),KCAST.you); });
  add("Good to meet you. I'm {name}. ‧‧‧ {intro}",KCAST.you,1); return jobs; }
let PV={state:'idle',done:0,total:0}, pvRun=false, pvAgain=false; const pvFirst=new Set();
/* The voice model runs in tts-worker.js (a background thread), so the screen never freezes while lines are made. */
let pvW=null, pvSeq=0; const pvCb={};
function pvMake(parts,v){ return new Promise((res,rej)=>{
  if(!pvW){ pvW=new Worker('tts-worker.js',{type:'module'});
    pvW.onmessage=e=>{ const c=pvCb[e.data.id]; delete pvCb[e.data.id]; if(c) e.data.error?c.rej(new Error(e.data.error)):c.res(e.data.wav); };
    pvW.onerror=e=>{ Object.keys(pvCb).forEach(id=>{ pvCb[id].rej(new Error('worker')); delete pvCb[id]; }); pvW=null; }; }
  const id=++pvSeq; pvCb[id]={res,rej}; pvW.postMessage({id,parts,voice:v[0],speed:v[1]}); }); }
/* A personal line that isn't made yet: make it next, show a quiet note, and wait for it (the device voice only if the
   phone can't run the model). Returns the clip, or null. */
async function pvWait(text,v,t,max=600000){ if(!useFiles()||!isPersonal(text)) return null; const k=pvKey(text,v); if(MINE[k]) return MINE[k];
  if(PV.state==='fail') return null; pvFirst.add(k); pvBuild(); const t0=Date.now(); pvToast(true);
  try{ while(Date.now()-t0<max){ if(!await wait(400,t)) return null; if(MINE[k]) return MINE[k]; if(PV.state==='fail') return null; } return null; }
  finally{ pvToast(false); } }
function pvToast(on){ let el=$('pvToast'); if(on&&!el){ document.body.insertAdjacentHTML('beforeend','<div class="pv-toast" id="pvToast" role="status"><span class="pv-dot"></span>Preparing your line in the lesson voice…</div>'); }
  else if(!on&&el) el.remove(); }
function pvStatusText(){ const p=PV; if(p.state==='ready') return 'Your name, introduction and meeting lines play in the lesson voice.';
  if(p.state==='work') return `Preparing your lines in the lesson voice… ${p.done}/${p.total}`;
  if(p.state==='fail') return 'Your own lines use the device voice on this browser.'; return ''; }
function pvShow(){ const el=$('pvRow'); if(el) el.textContent=pvStatusText(); if(state.route.name==='prep') document.querySelectorAll('[data-pvm]').forEach(el=>el.textContent=prepVoiceText(preps().find(m=>m.id===el.dataset.pvm))); }
function prepVoiceText(m){ if(!m||!useFiles()) return ''; const ready=m.lines.every(ln=>prepClip(prepMarkup(ln)));
  return ready?' · lesson voice':PV.state==='fail'?'':' · preparing voice…'; }
async function pvBuild(){ if(pvRun){ pvAgain=true; return; } if(!useFiles()||!state.onboarded) return; pvRun=true;
  try{ const jobs=pvJobs(), keys=new Set(jobs.keys());
    for(const k of Object.keys(MINE)) if(k.startsWith('pv:')&&!keys.has(k)){ URL.revokeObjectURL(MINE[k].url); delete MINE[k]; try{ await IDB.del(k); }catch(e){} }
    const todo=[...jobs].filter(([k])=>!MINE[k]); PV={state:todo.length?'work':'ready',done:jobs.size-todo.length,total:jobs.size}; pvShow();
    if(!todo.length) return;
    const pri=([k,j])=>pvFirst.has(k)?-1:j[2];
    while(todo.length){ todo.sort((a,b)=>pri(a)-pri(b)); const [k,[text,v]]=todo.shift(); pvFirst.delete(k); if(MINE[k]||isPersonal(text)&&!state.intro.name) continue;
      const parts=segsOf(text).map(([t,type])=>type==='pause'?{ms:650}:type==='pause-long'?{ms:1300}:t?{t}:null).filter(Boolean);
      const blob=new Blob([await pvMake(parts,v)],{type:'audio/wav'}); await IDB.set(k,{blob,type:blob.type,at:Date.now(),pv:true});

/* ---------------- LESSON QUIZZES ----------------
   Beyond "which is stronger": tap the weak words, tap the stressed word, tap where the pause goes,
   and "what do you do?" choices. Indices count words split on spaces; a pause answer n = after word n.
   JSON so tools/make_voice.py can read it (coach clips c-lesson{i}-q{k} and c-lesson{i}-q{k}-why). */
const LESSON_QUIZ = Object.fromEntries(LESSONS.map((l,i)=>[i,(l.quiz||[]).map(q=>q.type?q:({type:'choice',prompt:q.q,options:q.opts,answer:q.correct,why:q.explain}))]));
/* Round 3, "Your words": per scenario, questions without a script and the points to hit (self-checked).
   "coach": true = an instruction read by the coach; otherwise the other person asks it. Clips r3-{scenario}-{k}. */
const ROUND3 = {};
function viewQuiz(c){ const q=c.q, done=c.checked, words=q.text?q.text.split(' '):[];
  const st=n=>{ if(!done) return q.type==='weak'&&c.sel&&c.sel.has(n)?'sel':'';
    const ans=q.type==='weak'?q.answer.includes(n):q.answer===n, picked=q.type==='weak'?c.sel.has(n):c.pick===n;
    return ans&&picked?'right':ans?(q.type==='weak'?'miss':'right'):picked?'wrong':'dim'; };
  if(q.type==='choice') return `<div class="ls-opts">${q.options.map((o,n)=>`<button class="ls-opt ${st(n)}" type="button" data-act="ls-qpick" data-n="${n}" ${done?'disabled':''}>${esc(o)}</button>`).join('')}</div>`;
  if(q.type==='pause') return `<p class="qtext">${words.map((w,n)=>`<span class="qw">${esc(w)}</span> <button class="qgap ${st(n)}" type="button" data-act="ls-qpick" data-n="${n}" ${done?'disabled':''} aria-label="Pause after ${esc(w)}">‧‧‧</button>`).join(' ')}</p>`;
  return `<p class="qtext">${words.map((w,n)=>`<button class="qchip ${st(n)}" type="button" data-act="ls-qpick" data-n="${n}" ${done?'disabled':''}>${esc(w)}</button>`).join(' ')}</p>`; }
/* Quiz audio: the coach asks, each answer is read aloud (highlighted while it plays), and after a tap the coach
   says "Right." or "Not quite." and why. Spoken answers use the model voice; described actions ("[sitting still…]")
   are read by the coach. Clips: qz{i}-a / qz{i}-b (first example), qz{i}-{k}-o{n} (choice), qz{i}-{k}-t (tap quizzes). */
const spokenText=t=>segsOf(t).some(s=>s[0]);
async function qzPlay(id,text,coach,t){ const c=(useFiles()&&AUDIO[id])||pvClip(text,coach?KCAST.coach:KCAST.you)||await pvWait(text,coach?KCAST.coach:KCAST.you,t); if(t!==tok) return false; if(c) return playClip(c,[],t);
  if(!hasTTS) return true;
  if(coach||!spokenText(text)) return say(plainText(personal(text).replace(/[\[\]]/g,'')),t,{voice:themVoice(pickVoice())});
  for(const [txt,type] of segsOf(text)){
    if(type==='pause'||type==='pause-long'){ if(!await wait((type==='pause'?650:1300)/state.rate,t)) return false; continue; }
    if(txt&&!await say(txt,t,{pitch:type==='down'?0.88:1})) return false; }
  return t===tok; }
async function quizRead(auto){ const c=lsess&&lsess.cards[lsess.n]; if(!c||c.pick||c.checked) return; stopAll(); const t=++tok, i=lsess.i, l=LESSONS[i];
  if(auto&&!await wait(LEAD,t)) return;
  let items=[];
  if(c.type==='quiz'){ const p=l.pairs[c.k]; items=[...document.querySelectorAll('.ls-opt[data-act="ls-pick"]')].map(el=>({el,id:`qz${i}-${el.dataset.o}`,text:el.dataset.o==='a'?p.normal:p.better})); }
  else if(c.q.type==='choice') items=[...document.querySelectorAll('.ls-opt[data-act="ls-qpick"]')].map(el=>({el,id:`qz${i}-${c.k}-o${el.dataset.n}`,text:c.q.options[+el.dataset.n],coach:true}));
  else items=[{el:document.querySelector('.qtext'),id:`qz${i}-${c.k}-t`,text:c.q.text}];
  const aid=c.type==='quiz'?(c.k?`c-lesson${i}-p${c.k}-ask`:`c-lesson${i}-ask`):null;
  const ask=c.type==='quiz'?(useFiles()&&AUDIO[aid]||!useFiles()?aid:'c-fx-quiz'):`c-lesson${i}-q${c.k}`;
  if(c.type==='quiz'&&ILLUS[`l${i}p${c.k}`]) items=[];
  if(!await coachSay(ask,t)||!await wait(300,t)) return;
  for(const it of items){ if(!it.el||!it.el.isConnected) it.el=null; if(it.el) it.el.classList.add('reading');
    const ok=await qzPlay(it.id,it.text,it.coach,t); if(it.el) it.el.classList.remove('reading'); if(!ok||!await wait(350,t)) return; } }
async function quizVerdict(ok,why){ stopAll(); if(!coachOn()) return; const t=++tok;
  if(await coachSay(ok?'c-fx-right':'c-fx-wrong',t)&&await wait(150,t)) coachSay(why,t); }
function quizPick(c,n){ const q=c.q; if(c.checked) return;
  if(q.type==='weak'){ c.sel=c.sel||new Set(); c.sel.has(n)?c.sel.delete(n):c.sel.add(n); return render(); }
  c.pick=n; quizCheck(c); }
function quizCheck(c){ const q=c.q; c.checked=true;
  c.ok=q.type==='weak'?c.sel.size===q.answer.length&&q.answer.every(n=>c.sel.has(n)):c.pick===q.answer;
  stopAll(); render(); quizVerdict(c.ok,`c-lesson${lsess.i}-q${c.k}-why`); }

/* ---------------- FIRST TRY vs TODAY ----------------
   Every recorded line keeps its first take and its latest one (IndexedDB store "history", this device).
   The review shows the first try next to today's when it's from an earlier session. */
async function trackTake(id,blob,r,since){ if(!id||!r||r.empty) return null; let h=null;
  try{ h=await IDB.req('readonly',s=>s.get(id),'history'); }catch(e){}
  const entry={blob,type:blob.type,at:Date.now(),bars:r.bars,speech:r.speech};
  try{ await IDB.req('readwrite',s=>s.put({first:(h&&h.first)||entry,latest:entry},id),'history'); }catch(e){}
  const f=h&&h.first&&h.first.at<since?h.first:null;
  return f?{url:URL.createObjectURL(f.blob),at:f.at,bars:f.bars}:null; }
function firstRow(f,act){ if(!f) return ''; const d=new Date(f.at).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  return `<div class="cmp-row first"><span class="cmp-lab">First<small>${d}</small></span><span class="cmp-wave">${f.bars?waveSVG(f.bars,true):''}</span><button class="play-btn" type="button" data-act="${act}">▶ Play</button></div>`; }

/* ---------------- BREATHING CARD ----------------
   Three guided breaths (in 4, out 6) before the first drill line of "Calm your nerves". */
function breatheStart(){ let s=0; const tick=()=>{ const el=$('brc'); if(!el){ clearInterval(timerId); timerId=null; return; }
    if(s>=30){ clearInterval(timerId); timerId=null; el.className='br-circle'; $('brLabel').textContent='Ready'; $('brCount').textContent=''; $('brRound').textContent='Now say it, calm and slow.'; return; }
    const inP=(s%10)<4; el.className='br-circle '+(inP?'in':'out'); $('brLabel').textContent=inP?'Breathe in':'Breathe out';
    $('brCount').textContent=inP?4-(s%10):10-(s%10); $('brRound').textContent=`Breath ${Math.floor(s/10)+1} of 3`; s++; };
  tick(); timerId=setInterval(tick,1000); }

/* ---------------- ROUND 3 · MEETING PREP · BREATHE ----------------
   More session kinds on the lesson card engine: lsess.kind is 'lesson', 'r3', 'prep' or 'breathe'.
   They run on route "session" (full screen). */
function startKind(kind,cards,extra){ const from=['home','scenarios','prep','lessons'].includes(state.route.name)?state.route.name:'home';
  endSession(); endLesson(); lsess=Object.assign({kind,n:0,cards,from,t0:Date.now()},extra); state.route={name:'session'}; save(); enterCard(); }
function startR3(i){ startKind('r3',(ROUND3[i]||[]).map((q,k)=>({type:'r3',q:q.q,coach:!!q.coach,points:q.points,id:`r3-${i}-${k}`,clip:`r3-${i}-${k}`,k,got:new Set()})).concat({type:'done'}),{i}); }
function startBreathe(){ startKind('breathe',[{type:'breathe'},{type:'done'}],{}); }
async function r3Listen(auto){ const c=lsess.cards[lsess.n]; stopAll(); c.step='listen'; render(); const t=++tok;
  if(auto&&!await wait(LEAD,t)) return;
  const clip=useFiles()&&AUDIO[c.clip]; if(clip) await playClip(clip,[],t); else await say(c.q,t,{voice:c.coach?themVoice(pickVoice()):undefined});
  if(t===tok&&lsess){ c.step='ready'; render(); } }

/* Meeting prep: your own key lines for a real meeting. You mark stress and pauses; practice uses the
   device voice as the model, or one of your own takes ("Use this take as my model"). */
let pedit=null;
const preps=()=>state.preps||(state.preps=[]);
function prepMarkup(ln){ const n=ln.words.length;
  return ln.words.map((w,k)=>(ln.stress.includes(k)?`*${w}*`:w)+(ln.pauses.includes(k)&&k<n-1?' ‧‧‧':'')).join(' ')+(/[.!]$/.test(ln.words[n-1]||'')?' ↘':''); }
function prepLines(raw,old){ return raw.split('\n').map(x=>x.trim()).filter(Boolean).slice(0,6).map(t=>(old||[]).find(o=>o.words.join(' ')===t)||{words:t.split(/\s+/),stress:[],pauses:[]}); }
function startPrep(id){ const m=preps().find(x=>x.id===id); if(!m) return;
  startKind('prep',m.lines.map((ln,k)=>({type:'say',text:prepMarkup(ln),id:`pp-${id}-l${k}`,clip:null,label:`${m.who||'Meeting'} · line ${k+1} of ${m.lines.length}`,title:'Say this line'})).concat({type:'done'}),{id}); }
function viewPrep(){ const list=preps();
  return `<h1 class="page-title">Meeting prep</h1>
  ${list.length?'':`<div class="card prep-empty"><p class="ls-rule" style="font-size:1.2rem">Rehearse the lines that must land in your next real meeting.</p></div>`}
  ${list.map(m=>`<div class="card prep-card"><p class="eyebrow">${esc(m.who||'Meeting')}</p><div class="j-rank" style="font-size:1.25rem">${esc(m.goal||'Your key lines')}</div>
    <p class="j-next">${m.lines.length} line${m.lines.length>1?'s':''} · rehearsed ${m.reps||0}×<span data-pvm="${m.id}">${prepVoiceText(m)}</span></p>

  <button class="${list.length?'ghost-btn':'solid-btn'} wide" type="button" data-act="pp-new">New meeting</button>
  <button class="link-btn" type="button" data-act="pp-breathe">Breathe first</button>`; }
function viewPrepEdit(){ const e=pedit, pct=e.step==='form'?10:Math.round(20+80*(e.k+1)/e.lines.length);

    <p class="qtext">${ln.words.map((w,k)=>`<button class="qchip${ln.stress.includes(k)?' stress-on':''}" type="button" data-act="pp-w" data-n="${k}">${esc(w)}</button>${k<n-1?` <button class="qgap${ln.pauses.includes(k)?' right':''}" type="button" data-act="pp-g" data-n="${k}" aria-label="Pause after ${esc(w)}">‧‧‧</button>`:''}`).join(' ')}</p>
    <div class="say" style="margin-top:18px"><div class="say-body"><div class="say-text" style="font-size:1.2rem">${parseLine(prepMarkup(ln)).map((s,si)=>segHTML(s,'P',si)).join(' ')}</div></div></div></div>
    ${foot(`<div class="fx-btns"><button class="ghost-btn" type="button" data-act="pp-back">Back</button><button class="solid-btn" type="button" data-act="pp-next">${e.k<e.lines.length-1?'Next line':'Save'}</button></div>`)}`; }
function prepAct(a,btn){ const id=btn&&btn.dataset.id;
  if(a==='pp-new'){ pedit={id:null,who:'',goal:'',raw:'',lines:[],step:'form',k:0}; state.route={name:'prepedit'}; render(); window.scrollTo(0,0); return; }
  if(a==='pp-edit'){ const m=preps().find(x=>x.id===id); if(!m) return;
    pedit={id,who:m.who,goal:m.goal,raw:m.lines.map(l=>l.words.join(' ')).join('\n'),lines:m.lines.map(l=>({words:[...l.words],stress:[...l.stress],pauses:[...l.pauses]})),step:'form',k:0};
    state.route={name:'prepedit'}; render(); window.scrollTo(0,0); return; }
  if(a==='pp-del'){ if(!confirm('Delete this meeting?')) return; state.preps=preps().filter(x=>x.id!==id); save(); setTimeout(pvBuild,300); return render(); }
  if(a==='pp-go') return startPrep(id);
  if(a==='pp-breathe') return startBreathe();
  if(a==='pp-cancel'){ pedit=null; return go('prep'); }
  const e=pedit; if(!e) return;
  if(a==='pp-mark'){ e.who=$('pWho').value.trim(); e.goal=$('pGoal').value.trim(); e.raw=$('pLines').value; e.lines=prepLines(e.raw,e.lines);
    if(!e.lines.length){ $('pLines').classList.add('need'); $('pLines').focus(); return; } e.step='mark'; e.k=0; return render(); }
  const ln=e.lines[e.k], n=+(btn&&btn.dataset.n), tog=(arr,v)=>{ const i=arr.indexOf(v); i<0?arr.push(v):arr.splice(i,1); };

  if(a==='pp-g'){ tog(ln.pauses,n); return render(); }
  if(a==='pp-back'){ if(e.k>0) e.k--; else e.step='form'; return render(); }
  if(a==='pp-next'){ if(e.k<e.lines.length-1){ e.k++; return render(); }
    const m={id:e.id||('m'+Date.now().toString(36)),who:e.who,goal:e.goal,lines:e.lines,reps:(preps().find(x=>x.id===e.id)||{}).reps||0,at:Date.now()};

function lessonCards(i){ const l=LESSONS[i], cards=[{type:'intro'}];
  if(l.decision){ l.decision.steps.forEach((x,k)=>cards.push({type:'decide',k})); cards.push({type:'principle'},{type:'done'}); return cards; }
  // one idea per screen: each section, then its "Which is the PHC way?" choice, one card per rule, then picture questions
  l.sections.forEach((x,k)=>{ cards.push({type:'sec',k}); const pk=l.pairs.findIndex(p=>p.sec===k); if(pk>=0) cards.push({type:'quiz',k:pk});
    (x.rules||[]).forEach((r,j)=>cards.push({type:'rule',k,j}));
    (l.pics||[]).forEach((p,pi)=>{ if(p.after===k) cards.push({type:'pq',k:pi,sel:new Set()}); }); });
  if(l.roleplay){ cards.push({type:'rp'}); l.roleplay.turns.forEach((tn,j)=>cards.push({type:'say',them:tn.client,who:tn.who,text:tn.agent,id:`at${i}-t${j}`,clip:`at${i}-t${j}`,label:l.roleplay.scenario,title:'Your line',rp:j}));
    cards.push({type:'debrief'}); }
  (LESSON_QUIZ[i]||[]).forEach((q,k)=>cards.push({type:'q',q,k}));
  if(l.reflection) cards.push({type:'reflect'});
  cards.push({type:'done'}); return cards; }
function nextItem(){ return units().flatMap(u=>u.items).find(x=>!x.done&&!x.stub)||null; }
function nextUp(){ const it=nextItem(); endSession(); endLesson(); if(!it) return go('home'); if(it.kind==='lesson') startLesson(it.i); else startScenario(it.i); }
function startLesson(i){ const from=state.route.name==='lessons'?'lessons':'home'; endSession(); endLesson();
  lsess={kind:'lesson',i,n:0,cards:lessonCards(i),from,t0:Date.now()}; state.route={name:'lesson',i}; save(); enterCard(); }
function endLesson(){ if(!lsess) return; stopAll(); cancelRec(); lsess.cards.forEach(c=>{ if(c.url) URL.revokeObjectURL(c.url); }); lsess=null; }
function enterCard(){ stopAll(); cancelRec(); const c=lsess.cards[lsess.n], i=lsess.i;
  if(c.url) URL.revokeObjectURL(c.url); if(c.first) URL.revokeObjectURL(c.first.url); Object.assign(c,{step:null,res:null,err:null,url:null,first:null,checked:false,pick:null,sel:new Set(),dpick:null});
  if(c.type==='done'){ const k=lsess.kind; markDay();
    if(k==='lesson'){ const sc=lsess.cards.filter(x=>x.type==='quiz'||x.type==='q'||x.type==='say'||x.type==='pq'||x.type==='decide'), got=sc.filter(x=>x.type==='say'?x.good:x.ok).length;
      c.stars=award('l'+i,scoreStars(got,sc.length),!state.done[i]); state.done[i]=true; } else if(k==='r3'){ state.scR3=state.scR3||{}; state.scR3[i]=true; }
    else if(k==='prep'){ const m=preps().find(x=>x.id===lsess.id); if(m) m.reps=(m.reps||0)+1; } save(); }
  render(); window.scrollTo(0,0);
  const t=++tok;
  if(c.type==='say') return lsListen(true);
  if(c.type==='r3') return r3Listen(true);
  if(c.type==='breathe') breatheStart();
  if(!coachOn()) return;
  if(c.type==='q'||c.type==='quiz') return quizRead(true);
  const cs=k=>wait(LEAD,t).then(ok=>ok&&coachSay(k,t));
  if(c.type==='breathe') cs('c-fx-breathe');
  if(c.type==='idea') cs(`c-lesson${i}-rule`);
  else if(c.type==='intro') cs(`c-at${i}-intro`);
  else if(c.type==='pq') cs(`c-at${i}-pq${c.k}`);
  else if(c.type==='decide') cs(`c-dc${i}-s${c.k}`);
  else if(c.type==='principle') cs(`c-dc${i}-pr`);
  else if(c.type==='sec') cs(`c-at${i}-s${c.k}`);
  else if(c.type==='rule') cs(`c-at${i}-s${c.k}-r${c.j}`);
  else if(c.type==='rp') cs(`c-at${i}-rp`);
  else if(c.type==='debrief') cs(`c-at${i}-db`);
  else if(c.type==='reflect') cs(`c-at${i}-rf`);
  else if(c.type==='done'&&lsess.kind==='lesson') cs('c-fx-ldone'); }
const LEAD=500;   // ms of quiet before audio that starts by itself, so the screen settles first (a tap plays at once)
async function lsListen(auto){ const c=lsess.cards[lsess.n]; stopAll(); c.step='listen'; render(); const t=++tok;
  if(auto&&!await wait(LEAD,t)) return;
  if(coachOn()&&!lsess.sayIntro){ lsess.sayIntro=true; if(!await coachSay('c-fx-say',t)||!await wait(250,t)) return; }
  for(let m=0;m<(c.them||[]).length;m++){ const el=document.querySelectorAll('.at-client')[m]; if(el) el.classList.add('reading');
    const cl=useFiles()&&AUDIO[`${c.id}-c${m}`], ok=cl?await playClip(cl,[],t):await say(c.them[m],t,{voice:themVoice(pickVoice())}); if(el) el.classList.remove('reading');
    if(!ok||!await wait(350,t)) return; }
  if(!await lsModel(t)) return; if(t===tok&&lsess){ c.step='ready'; render(); } }
async function lsModel(t){ const c=lsess.cards[lsess.n], t0=performance.now(), clip=MINE[c.id]||(useFiles()&&AUDIO[c.clip])||pvClip(c.text,KCAST.you)||(lsess.kind==='prep'&&prepClip(c.text))||await pvWait(c.text,KCAST.you,t); let ok=true;
  if(t!==tok) return false;
  if(clip) ok=await playClip(clip,[...document.querySelectorAll('.w[data-l="L"]')],t);
  else for(const s of parseLine(c.text)){
    if(s.type==='pause'){ if(!(ok=await wait(800/state.rate,t))) break; }
    else if(s.type==='pause-long'){ if(!(ok=await wait(1700/state.rate,t))) break; }
    else if(s.type==='text'&&s.speak){ if(!(ok=await say(s.speak,t,{pitch:s.down?0.88:1}))) break; } }
  if(ok&&lsess) c.modelDur=(performance.now()-t0)/1000; return ok; }
function playUrl(url,t){ return new Promise(res=>{ if(!url||t!==tok) return res(false);
  recAudio=new Audio(url); recAudio.onended=()=>res(t===tok); recAudio.onerror=()=>res(false); recAudio.play().catch(()=>res(false)); }); }

/* ---------------- GUIDED PRACTICE (scenarios) ----------------
   One of your lines at a time: listen → record → compare → next.
   Round 1 shows your line (read along). Round 2 hides it (from memory). */
let sess=null, rec=null, micStream=null, recAudio=null;
const SPEEDS=[0.7,0.85,1,1.15];
function altSpeaker(sc,who){ return who!=='you'&&who!=='stage'&&[...new Set(sc.lines.map(x=>x[0]).filter(x=>x!=='you'&&x!=='stage'))].indexOf(who)===1; }
function nameOf(sc,who){ return who==='you'?'You':(who.includes(':')?who.split(':')[1]:sc.them); }
function yourLines(sc){ return sc.lines.map((l,k)=>l[0]==='you'?k:-1).filter(k=>k>=0); }
function contextOf(sc,li){ const out=[]; for(let k=li-1;k>=0&&sc.lines[k][0]!=='you';k--) out.unshift(k); return out.slice(-2); }
function innerPauses(text){ const s=parseLine(text), first=s.findIndex(x=>x.type==='text'), last=s.map(x=>x.type).lastIndexOf('text');
  return s.filter((x,k)=>k>first&&k<last&&(x.type==='pause'||x.type==='pause-long')).length; }
function lineHTML(sc,li){ return parseLine(sc.lines[li][1]).map((s,si)=>segHTML(s,li,si)).join(' '); }

async function speakLine(sc,li,t,yv,tv){
  const [who,text]=sc.lines[li];
  if(who==='stage') return wait(1200/state.rate,t);
  const clip=clipFor(sc,li)||await pvWait(text,kCast(sc)[who],t); if(t!==tok) return false;
  if(clip) return playClip(clip,[...document.querySelectorAll(`.w[data-l="${li}"]`)],t);
  const segs=parseLine(text), mine=who==='you', alt=altSpeaker(sc,who);
  for(let si=0;si<segs.length;si++){ const s=segs[si];
    if(s.type==='pause'){ if(!await wait(800/state.rate,t)) return false; continue; }
    if(s.type==='pause-long'){ if(!await wait(1700/state.rate,t)) return false; continue; }
    if(s.type!=='text'||!s.speak) continue;
    const spans=[...document.querySelectorAll(`.w[data-l="${li}"][data-s="${si}"]`)];
    const ok=await say(s.speak,t,{voice:mine?yv:tv, pitch:(s.down?0.88:1)*(!mine&&yv===tv?1.15:1)*(alt?0.85:1), onb:e=>{ if(e.name&&e.name!=='word') return; let hit=null; spans.forEach(x=>{ if(+x.dataset.c<=e.charIndex) hit=x; }); spans.forEach(x=>x.classList.toggle('on',x===hit)); }});
    spans.forEach(x=>x.classList.remove('on')); if(!ok) return false; }
  return true;
}
async function speakModel(t){ const sc=SCENARIOS[sess.i], li=sess.lines[sess.k], yv=pickVoice(), t0=performance.now();
  const ok=await speakLine(sc,li,t,yv,themVoice(yv)); if(ok&&sess) sess.modelDur[li]=(performance.now()-t0)/1000; return ok; }
function playMe(t){ return new Promise(res=>{ if(!sess||!sess.url||t!==tok) return res(false);
  recAudio=new Audio(sess.url); recAudio.onended=()=>res(t===tok); recAudio.onerror=()=>res(false); recAudio.play().catch(()=>res(false)); }); }
async function runBtn(btn,fn){ const same=activeBtn===btn; stopAll(); if(same) return;
  const t=++tok; activeBtn=btn; btn.dataset.html=btn.innerHTML; btn.classList.add('playing'); if(!btn.classList.contains('spk')) btn.textContent='■ Stop';
  await fn(t); if(t===tok) stopAll(); }

/* Start a scenario straight into practice. The first card is the setting (the coach reads it), then the lines.
   Round 2 (from memory) is picked automatically once round 1 is done. */
function startScenario(i){ if(state.scDone[i]&&(ROUND3[i]||[]).length) return startR3(i); startSession(i,(state.scR1||{})[i]?2:1,true); }
function startSession(i,round,intro){ const from=sess?sess.from:['home','scenarios'].includes(state.route.name)?state.route.name:'home';
  endSession(); endLesson(); sess={i,round,k:0,lines:yourLines(SCENARIOS[i]),modelDur:{},peek:false,from,t0:Date.now()};
  state.route={name:'scenario',i}; state.lastSc=i; save();
  if(!intro){ enterLine(); window.scrollTo(0,0); return; }
  sess.step='intro'; render(); window.scrollTo(0,0);
  if(coachOn()){ const t=++tok; wait(LEAD,t).then(ok=>ok&&coachSay(`c-sc${i}-intro`,t)).then(ok=>{ if(ok&&sess&&sess.i===i&&sess.step==='intro') enterLine(); }); } }   // after the setting is read, the lines start by themselves
function endSession(){ stopAll(); cancelRec(); if(sess&&sess.url) URL.revokeObjectURL(sess.url); sess=null; }
function enterLine(){ if(sess.url) URL.revokeObjectURL(sess.url); if(sess.first) URL.revokeObjectURL(sess.first.url); Object.assign(sess,{url:null,res:null,err:null,peek:false,first:null}); listen(true); }
async function listen(auto){ const sc=SCENARIOS[sess.i], li=sess.lines[sess.k], yv=pickVoice(), tv=themVoice(yv), note=sc.lines[li][2];
  stopAll(); sess.step='listen'; render();
  const t=++tok, coach=coachOn(); if(auto&&!await wait(LEAD,t)) return;
  if(coach&&!sess.introDone){ sess.introDone=true; const cue=sess.round===1?'r1':'r2'; state.cues=state.cues||{};   // the round explanation plays once, ever
    if(!state.cues[cue]){ state.cues[cue]=true; save(); if(!await coachSay('c-fx-'+cue,t)||!await wait(300,t)) return; } }
  for(const c of contextOf(sc,li)){ if(!await speakLine(sc,c,t,yv,tv)) return; if(!await wait(350/state.rate,t)) return; }
  if(sess.round===1){ if(coach&&note&&(!await coachSay(`c-s${sess.i}-l${li}`,t)||!await wait(250,t))) return; if(!await speakModel(t)) return; }
  else if(coach&&!await coachSay('c-fx-turn',t)) return;
  if(t===tok){ sess.step='ready'; render(); } }

async function startRec(){ stopAll();
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){ sess.err=window.isSecureContext?'nomic':'insecure'; render(); return; }
  sess.step='arming'; sess.err=null; render(); const key=sess.k;
  try{ micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}}); }
  catch(e){ if(sess&&sess.k===key){ sess.step='ready'; sess.err=window.isSecureContext?'denied':'insecure'; render(); } return; }
  if(!sess||sess.k!==key||sess.step!=='arming'){ releaseMic(); return; }
  const chunks=[], mr=new MediaRecorder(micStream), t0=Date.now();
  mr.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
  mr.onstop=async()=>{ releaseMic(); if(!sess||sess.k!==key) return;
    const blob=new Blob(chunks,{type:mr.mimeType||(chunks[0]&&chunks[0].type)||'audio/mp4'});
    if(sess.url) URL.revokeObjectURL(sess.url); sess.url=URL.createObjectURL(blob); sess.step='review'; sess.res='wait'; render();
    const r=await analyze(blob); if(sess&&sess.k===key&&sess.step==='review'){ sess.res=r; sess.first=await trackTake(lineId(sess.i,sess.lines[key]),blob,r,sess.t0); render(); const k=judge().key; if(k==='good'&&sess.round===2) (sess.good=sess.good||new Set()).add(sess.k); if(coachOn()&&k){ const t=++tok; coachSay('c-fx-'+k,t); } } };
  rec={mr,timer:setInterval(()=>{ const s=(Date.now()-t0)/1000, el=$('recTime'); if(el) el.textContent=s.toFixed(1)+'s'; if(s>=40) stopRec(); },100)};
  mr.start(); sess.step='rec'; sess.err=null; render(); }
function stopRec(){ if(!rec) return; clearInterval(rec.timer); const r=rec; rec=null; if(r.mr.state!=='inactive') r.mr.stop(); }
function cancelRec(){ if(rec){ clearInterval(rec.timer); rec.mr.onstop=null; if(rec.mr.state!=='inactive') rec.mr.stop(); rec=null; } releaseMic(); }
function releaseMic(){ if(micStream) micStream.getTracks().forEach(x=>x.stop()); micStream=null; }

/* Rough speech measurements from the recording: speaking time, pauses, and a waveform. */
async function analyze(blob){ try{
  const AC=window.AudioContext||window.webkitAudioContext, ac=new AC(), buf=await ac.decodeAudioData(await blob.arrayBuffer()); try{ ac.close(); }catch(e){}
  const d=buf.getChannelData(0), fr=Math.max(1,Math.round(buf.sampleRate*0.02)), n=Math.floor(d.length/fr), rms=new Float32Array(n);
  for(let f=0;f<n;f++){ let s=0; for(let k=f*fr;k<(f+1)*fr;k++) s+=d[k]*d[k]; rms[f]=Math.sqrt(s/fr); }
  const sorted=[...rms].sort((a,b)=>a-b), noise=sorted[Math.floor(n*0.1)]||0, peak=sorted[Math.floor(n*0.98)]||0;
  if(peak<0.01||peak<noise*2.5) return {empty:true};
  const thr=noise+(peak-noise)*0.18, loud=[...rms].map(v=>v>thr), a=loud.indexOf(true), b=loud.lastIndexOf(true);
  let pauses=0, run=0; for(let f=a;f<=b;f++){ if(!loud[f]) run++; else { if(run>=18) pauses++; run=0; } }
  const N=60, bars=[]; for(let k=0;k<N;k++){ const s=Math.floor(k*n/N), e=Math.max(s+1,Math.floor((k+1)*n/N)); let m=0; for(let f=s;f<e;f++) m=Math.max(m,rms[f]); bars.push([Math.min(1,m/peak), m<=thr]); }
  const voiced=[]; for(let f=a;f<=b;f++) if(loud[f]) voiced.push(f);
  const avg=arr=>arr.reduce((t,f)=>t+rms[f],0)/arr.length, end=voiced.length>40?avg(voiced.slice(-15))/avg(voiced):null;
  return {speech:(b-a+1)*0.02, pauses, bars, end, a:a*0.02, b:(b+1)*0.02};
}catch(e){ return null; } }
function waveSVG(bars,dim){ return `<svg class="wave${dim?' dim':''}" viewBox="0 0 120 32" preserveAspectRatio="none" aria-hidden="true">${bars.map(([h,sil],k)=>{ const H=Math.max(1.5,h*30); return `<rect${sil?' class="sil"':''} x="${k*2}" y="${(32-H)/2}" width="1.3" height="${H}" rx=".6"/>`; }).join('')}</svg>`; }
/* Verdict for the result banner: good (green), almost (gold) or neutral (blue). */
function judge(){ const li=sess.lines[sess.k]; return judgeRes(sess.res,sess.modelDur[li],innerPauses(SCENARIOS[sess.i].lines[li][1]),sess.k); }
function judgeRes(r,md,exp,n){
  if(r==='wait') return {v:'neutral',t:'Listening back…',items:[]};
  if(!r) return {v:'neutral',t:'Recorded',items:[],tip:'Play both and compare.'};
  if(r.empty) return {v:'almost',t:'No speech heard',items:[],tip:'Check the microphone, then try again.',key:'nospeech'};
  const items=[]; let ok=true, fail=null;
  if(md){ const ratio=r.speech/md, nums=`${r.speech.toFixed(1)}s, model ${md.toFixed(1)}s.`;
    if(ratio<0.8){ ok=false; fail=fail||'pace'; items.push(`<b>Pace</b> ${nums} Slow down and let the pauses land.`); }
    else items.push(`<b>Pace</b> ${nums} ${ratio>1.4?'Slower is fine if the pauses were on purpose.':'Close to the model.'}`); }
  if(exp){ if(r.pauses<exp){ ok=false; fail=fail||'pause'; items.push(`<b>Pauses</b> ${r.pauses} of ${exp}. Hold each ‧‧‧ for a full beat.`); }
    else items.push(`<b>Pauses</b> ${r.pauses} of ${exp}. ${r.pauses>exp+2?'Fine if deliberate, not if you were searching for words.':'Right where they belong.'}`); }
  if(r.end!=null){ if(r.end<0.55){ ok=false; fail=fail||'end'; items.push(`<b>Ending</b> your last word dropped to ${Math.round(r.end*100)}% of your volume. Keep it strong to the final word.`); }
    else items.push('<b>Ending</b> held to the last word.'); }
  const TIP={pace:'Slow down. Let the pauses land.',pause:'Hold each pause a full beat.',end:'Keep the last word strong.'};
  return {v:ok?'good':'almost', t:ok?['Well delivered','Steady and clear','That lands'][n%3]:'Almost there', items, tip:ok?'':TIP[fail], key:ok?'good':fail};
}

function act(a,btn){
  if(a==='tomap'){ endSession(); endLesson(); return go('home'); }

  if(a==='profile'){ state.onboarded=false; save(); render(); window.scrollTo(0,0); return; }
  if(a.startsWith('ls-')||a==='nextup') return lessonAct(a,btn);
  if(a==='speed'){ state.rate=SPEEDS.find(x=>x>state.rate+0.001)??SPEEDS[0]; save(); btn.textContent=(+state.rate.toFixed(2))+'×'; return; }
  if(a==='node') return mtnSheet(btn.dataset.k);
  if(a==='mzoom'){ clearTimeout(flyT); flyT=0; const st=$('mstage'); camMode=camMode==='all'?'you':'all'; zoomLabel(); $('msheet').hidden=true;
    return camTo(camMode==='all'?camOverview(st.clientWidth,st.clientHeight):camFor(MTN.edge,st.clientWidth,st.clientHeight),true); }
  if(a==='mcamp'){ clearTimeout(flyT); flyT=0; const st=$('mstage'); camMode='camp'; zoomLabel(); return camTo(camCamp(+btn.dataset.u,st.clientWidth,st.clientHeight),true); }
  if(a.startsWith('st-')) return studioAct(a,btn);

  if(a==='sc-start') return startScenario(+btn.dataset.i);

  const i=sess?sess.i:state.route.i;
  if(a==='start1'||a==='start2') return startSession(i,a==='start1'?1:2,true);
  if(a==='round1'||a==='round2') return startSession(i,a==='round1'?1:2);

  if(a==='listen') return listen();
  if(a==='peek'){ sess.peek=!sess.peek; return render(); }

    if(sess.k<sess.lines.length-1){ sess.k++; enterLine(); window.scrollTo(0,0); }

/* ---------------- BACKUP ----------------
   Progress lives on this device only. "Back up" packs one file: progress, meeting prep, your recordings and first
   takes (not the lines the phone makes itself; those rebuild). Two taps on purpose: preparing takes a moment, and
   iPhones only open the share sheet straight from a tap. "Restore" reads the file back on any device. */
let BK=null;   // the prepared backup file
const blobTo64=b=>new Promise(r=>{ const f=new FileReader(); f.onload=()=>r(f.result); f.readAsDataURL(b); });
async function bkPack(v){ if(v instanceof Blob) return {__blob:await blobTo64(v)}; if(Array.isArray(v)||!v||typeof v!=='object') return v;
  const o={}; for(const [k,x] of Object.entries(v)) o[k]=await bkPack(x); return o; }
async function bkUnpack(v){ if(v&&v.__blob) return (await fetch(v.__blob)).blob(); if(Array.isArray(v)||!v||typeof v!=='object') return v;
  const o={}; for(const [k,x] of Object.entries(v)) o[k]=await bkUnpack(x); return o; }
async function bkPrepare(){ const out={app:'phc-agent-training',v:1,at:new Date().toISOString(),state:JSON.parse(localStorage.getItem(KEY)||'{}'),takes:{},history:{}};
  for(const store of ['takes','history']) for(const k of (await IDB.req('readonly',s=>s.getAllKeys(),store))||[]){
    if(String(k).startsWith('pv:')) continue; out[store][k]=await bkPack(await IDB.req('readonly',s=>s.get(k),store)); }
  BK=new File([JSON.stringify(out)],`phc-agent-training-backup-${ymd(new Date())}.json`,{type:'application/json'}); }
function bkSave(){ const f=BK; if(!f) return; const done=()=>{ state.lastBackup=Date.now(); save(); BK=null; render(); };
  const dl=()=>{ const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download=f.name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); done(); };
  if(navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f],title:'PHC Agent Training backup'}).then(done).catch(e=>{ if(e&&e.name==='AbortError') return; dl(); });
  else dl(); }
async function bkRestore(file){ let d=null; try{ d=JSON.parse(await file.text()); }catch(e){}
  if(!d||d.app!=='phc-agent-training'||!d.state) return alert("That file isn't a PHC Agent Training backup.");
  const when=new Date(d.at).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
  if(!confirm(`Restore the backup from ${when}? It replaces the progress on this device.`)) return;
  for(const store of ['takes','history']){
    for(const k of (await IDB.req('readonly',s=>s.getAllKeys(),store))||[]) if(!String(k).startsWith('pv:')) await IDB.req('readwrite',s=>s.delete(k),store);
    for(const [k,v] of Object.entries(d[store]||{})){ const val=await bkUnpack(v); await IDB.req('readwrite',s=>s.put(val,k),store); } }
  localStorage.setItem(KEY,JSON.stringify(Object.assign(d.state,{route:{name:'home'}}))); location.reload(); }
function bkLast(){ return state.lastBackup?new Date(state.lastBackup).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}):'never'; }

  if(n==='studio'){
    $('useMine').addEventListener('change',e=>{ state.useMine=e.target.checked; save(); });
    document.querySelectorAll('.studio-sc').forEach(d=>d.addEventListener('toggle',()=>{ const si=+d.dataset.si; d.open?studioOpen.add(si):studioOpen.delete(si); }));
  }
  if(n==='settings'){
    $('voiceSel')?.addEventListener('change',e=>{ state.voice=e.target.value; save(); });
    $('coachVoiceT').addEventListener('change',e=>{ state.coachVoice=e.target.checked; save(); });
    $('rate').addEventListener('input',e=>{ state.rate=+e.target.value; $('rateVal').textContent=state.rate.toFixed(2)+'×'; save(); });
    $('testVoice').addEventListener('click',e=>{ const b=e.currentTarget, c=AUDIO['at0-t0']; if(useFiles()&&c) runBtn(b,t=>playClip(c,[],t)); else playSegs(b, segsOf('Good to meet you. ‧‧‧ Thank you for your time. ↘')); });
    document.querySelectorAll('[data-src]').forEach(b=>b.addEventListener('click',()=>{ stopAll(); state.voiceSrc=b.dataset.src; save(); render(); }));
    $('bkBtn')?.addEventListener('click',async e=>{ const b=e.currentTarget; b.disabled=true; b.textContent='Preparing…'; try{ await bkPrepare(); }catch(err){ alert('The backup could not be prepared.'); } render(); });
    $('bkSave')?.addEventListener('click',bkSave);
    $('bkFile').addEventListener('change',e=>{ const f=e.target.files[0]; if(f) bkRestore(f); e.target.value=''; });
    $('resetBtn').addEventListener('click',()=>{ if(confirm('Reset all progress, ratings and notes? This cannot be undone.')){ const keep={rate:state.rate,voice:state.voice}; try{ localStorage.removeItem(KEY); }catch(e){} state=Object.assign({route:{name:'home'},done:{},own:{},notes:{},ratings:{},intro:{name:'',who:'',get:'',avoid:''},scMode:'shadow',coach:true,scOwn:{},scDone:{},lastSc:null},keep); save(); render(); } });
  }
}
$('tabbar').addEventListener('click',e=>{ const b=e.target.closest('[data-go]'); if(b) go(b.dataset.go); });
let trailT; addEventListener('resize',()=>{ clearTimeout(trailT); trailT=setTimeout(()=>{ if(state.route.name==='home') drawScene(); },100); });
if(document.fonts) document.fonts.ready.then(()=>{ if(state.route.name==='home') drawScene(); });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ if(state.route.name==='home') drawScene(); });
$('backBtn').addEventListener('click',()=>{ if(sess) act('exit'); else go($('backBtn').dataset.go); });
$('main').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(b) act(b.dataset.act,b); });
load(); if(state.vsV!==2){ state.vsV=2; delete state.voiceSrc; save(); }   // once: every device back to the natural voices (an old "Device voice" choice made everything robotic)
state.route={name:'home'}; render(); scrollToNow(); offlineInit(); setTimeout(()=>loadMineReady.then(pvBuild),1000);   // every visit opens on the mountain, at your current step
const loadMineReady=loadMine().then(()=>{ if(['studio','settings'].includes(state.route.name)) render(); });

</script>
</body>
</html>
